# Local orchestration for the inference service and its metrics scraper.
#
#   docker compose up --build
#   docker compose down -v
#
# ---------------------------------------------------------------------------
# Two details that decide whether this works at all
# ---------------------------------------------------------------------------
#
# "8000:8000" IS QUOTED. Unquoted, YAML reads 8000:8000 as a sexagesimal
# integer — base-60 — and the port mapping silently becomes the number
# 28800000. Compose then reports a confusing type error, or on some versions
# binds nothing. Every port mapping in this file is a quoted string.
#
# start_period ON THE HEALTHCHECK. FinBERT takes tens of seconds to load
# (longer on the first run, when the weights are still being downloaded).
# Without start_period the container fails its first three health probes while
# it is legitimately starting, is marked unhealthy, and anything depending on
# it never starts. The same mistake in an ECS task definition makes the service
# restart-loop forever: the task is killed for being unhealthy before it has
# ever finished loading, which reads in the console as a crash with no error.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: finbert-api:local
    container_name: finbert-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # These two override .env, because `environment:` takes precedence over
      # `env_file:` and .env is written for the HOST-side run.
      #
      # MODEL_SOURCE. .env ships `mlflow`, which is right for
      # `python app/main.py` on the host and wrong in here. The registry
      # lookup needs the tracking server, the server is started by the README
      # as `mlflow server --port 5000`, and that binds 127.0.0.1 — the
      # container arrives via the host gateway, not loopback, so it is refused.
      # The failure is quiet in the worst way: lifespan catches it, uvicorn
      # starts anyway, and /health answers 503 indefinitely while the
      # container logs "Connection refused" for an address that looks correct.
      # `huggingface` is also what CI and the Fargate task use, so the
      # container here loads the model the same way the deployed one does.
      MODEL_SOURCE: huggingface
      # Correct for a container even though it is unused above, so that
      # flipping MODEL_SOURCE back to `mlflow` fails for one reason instead of
      # two. It still needs the tracking server bound to all interfaces
      # (`mlflow server --host 0.0.0.0 --port 5000`), which is why that is not
      # the default: it puts the model registry on the local network, and a
      # reviewer should not have to do that to see the stack run.
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000
    volumes:
      # The MLflow tracking server runs on the HOST and writes run metadata to
      # ./mlruns and model artifacts to ./mlartifacts. Mounting both read-only
      # lets the container resolve models:/finbert@production without being
      # able to modify the registry — a container that can rewrite the registry
      # it loads from can promote itself.
      - ./mlruns:/app/mlruns:ro
      - ./mlartifacts:/app/mlartifacts:ro
      # The Hub cache, as a named volume rather than a host mount: the
      # container runs as uid 10001 and would not be able to write into a
      # developer-owned ~/.cache/huggingface. Without this the model is
      # downloaded again on every `up`, which is the difference between a
      # healthcheck that passes in seconds and one racing a 400 MB download.
      - hf-cache:/home/appuser/.cache/huggingface
    extra_hosts:
      # Linux does not resolve host.docker.internal on its own; host-gateway is
      # the documented alias for the host from inside the container. On macOS
      # and Windows Docker Desktop provides the name already, and this entry is
      # harmless there — which is what makes it safe to commit rather than
      # leaving a platform-specific step in the README.
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Probes GET /health. A Python one-liner rather than curl, because
      # python:3.12-slim ships no curl and adding it means an apt layer in the
      # production image for the sake of a health probe. urlopen raises on a
      # 503, which exits non-zero — exactly the required behaviour.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      # 300s, not 180s. On a cold hf-cache volume the container downloads the
      # model before it can serve anything, and a probe that starts counting
      # failures mid-download kills the container for being slow rather than
      # broken. Failures during start_period do not count toward `retries`,
      # so this only costs time on a run that was going to fail anyway.
      start_period: 300s
    restart: unless-stopped

  prometheus:
    # prometheus.yml is told to scrape the target `api:8000`. That name is a
    # Compose service name, resolvable only by a container on this network, so
    # Prometheus has to live here for that configuration to point at anything.
    # Pinned to an exact tag: :latest would make the monitoring stack change
    # underneath the project between runs.
    image: prom/prometheus:v2.54.1
    container_name: finbert-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
    depends_on:
      api:
        # Wait for healthy, not merely for started: Prometheus scraping a
        # still-loading API records the target as down and the first minutes of
        # every run look like an outage.
        condition: service_healthy
    restart: unless-stopped

  grafana:
    # The dashboard in monitoring/ is only a deliverable if something loads it.
    # Without this service the JSON sits in the repository and nobody — the
    # author included — ever sees whether its queries match the metric names
    # the service actually emits. A panel with a typo renders "No data", which
    # looks like a broken service rather than a broken query.
    image: grafana/grafana:11.2.0
    container_name: finbert-grafana
    ports:
      - "3000:3000"
    environment:
      # Anonymous viewing, so a reviewer can open the dashboard without an
      # account. Admin stays password-protected. This is a LOCAL stack behind
      # no network; the same settings on anything reachable would be wrong.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
    volumes:
      # Datasource and dashboard provider definitions.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboards themselves. The provider reads this directory.
      - ./monitoring:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  # The Hugging Face cache for the api service. Declared as a named volume so
  # Docker owns it and the container's unprivileged user can write to it.
  # `docker compose down -v` removes it, which is correct for a clean teardown
  # and means the next `up` re-downloads the model.
  hf-cache:
